<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkyCast - Light Weather</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <h1><span class="logo">☁️</span> SkyCast</h1>

    <div class="search-box">
      <span class="icon">🔍</span>
      <input type="text" id="city" placeholder="Search for city..." autocomplete="off">
      <button id="locBtn" title="Use my location">📍</button>
    </div>

    <div class="main-card">
      <div class="big-icon" id="icon">☀️</div>
      <div class="temp" id="temp">--°C</div>
      <div class="city">📍 <span id="cityName">--</span></div>
      <div class="desc" id="desc">Search a city to see weather</div>
    </div>

    <div class="details">
      <div class="tile"><div class="ti">💧</div><span>Humidity</span><b id="humidity">--</b></div>
      <div class="tile"><div class="ti">🌬️</div><span>Wind</span><b id="wind">--</b></div>
      <div class="tile"><div class="ti">🌡️</div><span>Feels Like</span><b id="feels">--</b></div>
      <div class="tile"><div class="ti">👁️</div><span>Visibility</span><b id="vis">--</b></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
